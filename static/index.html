<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Jarvis</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />

<!-- Type -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Lilita+One&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet" />

<style>
  :root {
    /* Shared tokens overridden per theme on <body data-theme="..."> */
    --bg: #efe9dc;
    --bg-elev: #f5f0e3;
    --bg-card: #fbf6ea;
    --ink: #1f1d18;
    --ink-2: #4a463c;
    --ink-3: #847d6e;
    --line: #d9d2bf;
    --line-soft: #e5dfce;
    --accent: #c0411a;
    --accent-soft: #e9d3c5;
    --jdm-magenta: #c83a73;
    --jdm-green:   #4ea63c;
    --jdm-yellow:  #d4a90a;
    --jdm-cyan:    #1f97b1;
    --jdm-orange:  #d96810;
    --jdm-violet:  #7a4fbe;
    --font-sans: 'Inter', system-ui, sans-serif;
    --font-serif: 'Newsreader', Georgia, serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    --font-display: 'Newsreader', Georgia, serif;
    --radius: 6px;
    --radius-lg: 10px;
    --shadow-sm: 0 1px 0 rgba(0,0,0,0.04);
    --shadow:    0 1px 2px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.04);
    --density:   1;   /* multiplier for paddings */
  }

  /* ── Theme: PAPER (safe — warm minimal, claude.ai-like) ── */
  body[data-theme="paper"] {
    --bg: #efe9dc;
    --bg-elev: #f5f0e3;
    --bg-card: #fbf6ea;
    --ink: #1f1d18;
    --ink-2: #4a463c;
    --ink-3: #847d6e;
    --line: #d9d2bf;
    --line-soft: #e5dfce;
    --accent: #c0411a;        /* claude-ish terracotta */
    --accent-soft: #e9d3c5;
    --font-display: 'Newsreader', Georgia, serif;
    --density: 1;
  }

  /* ── Theme: LAB (medium — refined dark, library at midnight) ── */
  body[data-theme="lab"] {
    --bg: #181b22;           /* deep ink */
    --bg-elev: #1f232c;
    --bg-card: #262b36;
    --ink: #ebe9e4;          /* warm cream */
    --ink-2: #a09c92;
    --ink-3: #6b6760;
    --line: #353a47;
    --line-soft: #2a2f3a;
    --accent: #7eb5c5;       /* muted, refined cyan — echoes JDM cyan */
    --accent-soft: #1f3a44;
    --font-sans: 'Inter', system-ui, sans-serif;
    --font-display: 'Newsreader', Georgia, serif;
    --density: 0.95;
    --radius: 5px;
    --radius-lg: 8px;
    --shadow-sm: 0 1px 0 rgba(0,0,0,0.4);
    --shadow:    0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.25);
  }
  body[data-theme="lab"] .kbd {
    background: #14171d;
    border-color: var(--line);
  }
  /* Subtle glow on focus + interactive elements in lab */
  body[data-theme="lab"] .om-select__trigger:hover,
  body[data-theme="lab"] input:focus {
    border-color: var(--ink-3);
  }

  /* Avant que React monte, on applique le thème système via CSS
     pour éviter un flash blanc sur un user en dark mode. */
  body:not([data-theme]) { /* paper tokens (= défaut clair) */ }
  @media (prefers-color-scheme: dark) {
    body:not([data-theme]) {
      --bg: #181b22; --bg-elev: #1f232c; --bg-card: #262b36;
      --ink: #ebe9e4; --ink-2: #a09c92; --ink-3: #6b6760;
      --line: #353a47; --line-soft: #2a2f3a;
      --accent: #7eb5c5; --accent-soft: #1f3a44;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  ::selection { background: var(--accent); color: var(--bg); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: var(--line);
    border-radius: 10px;
    border: 2px solid var(--bg);
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-3); }

  /* Lab-specific: subtle grid */
  body[data-theme="lab"] .lab-grid {
    background-image:
      radial-gradient(circle at 1px 1px, rgba(235,233,228,0.04) 1px, transparent 0);
    background-size: 24px 24px;
  }

  /* Custom select fix — the heart of the dropdown bug fix */
  .om-select {
    position: relative;
    user-select: none;
  }
  .om-select__trigger {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--ink);
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    text-align: left;
    transition: border-color 0.12s, background 0.12s;
  }
  .om-select__trigger:hover { border-color: var(--ink-3); }
  .om-select__trigger:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .om-select__chevron { margin-left: auto; opacity: 0.5; }
  .om-select__menu {
    position: absolute;
    top: calc(100% + 4px);
    left: 0; right: 0;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    z-index: 100;
    max-height: 320px;
    overflow-y: auto;
    padding: 4px;
  }
  .om-select__option {
    display: flex;
    align-items: center;
    gap: 8px;
    /* The fix: full-width clickable area, generous padding */
    padding: 9px 10px;
    cursor: pointer;
    border-radius: calc(var(--radius) - 1px);
    color: var(--ink);
    font-size: 13px;
    line-height: 1.35;
    /* No pointer-events hijack on children */
  }
  .om-select__option * { pointer-events: none; }
  .om-select__option:hover { background: var(--line-soft); }
  .om-select__option[aria-selected="true"] {
    background: var(--accent-soft);
    color: var(--ink);
  }
  .om-select__option .check {
    margin-left: auto;
    opacity: 0;
  }
  .om-select__option[aria-selected="true"] .check { opacity: 1; }

  /* Tabs / chips */
  .focus-ring:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* Code-y monospace strings */
  .mono { font-family: var(--font-mono); }
  .kbd {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 2px 6px;
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 3px;
    background: var(--bg-elev);
    color: var(--ink-2);
  }

  /* Anim */
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .fade-up { animation: fade-up 0.18s ease-out; }

  /* Pulsating dot (for "agent thinking") */
  @keyframes pulse-dot {
    0%, 100% { opacity: 0.3; }
    50%      { opacity: 1; }
  }
  .pulse-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    animation: pulse-dot 1.2s ease-in-out infinite;
  }

  /* ── Narration LLM (Jarvis pane, Agent bubble) ──
     Le LLM émet des <div class="jdm-narration"> et <span class="jarvis-term">.
     Ces styles les rendent lisibles et thématisés. */
  .jdm-narration-pane .jdm-narration,
  .jdm-agent-bubble .jdm-narration {
    display: block;
    padding: 6px 10px;
    margin: 4px 0;
    background: var(--bg-elev);
    border-left: 2px solid var(--line);
    border-radius: 0 var(--radius) var(--radius) 0;
    font-size: 12px;
    color: var(--ink-2);
    line-height: 1.55;
    font-family: var(--font-mono);
  }
  .jdm-narration-pane .jdm-thinking,
  .jdm-agent-bubble .jdm-thinking {
    display: block;
    padding: 8px 12px;
    margin: 6px 0;
    background: var(--bg-elev);
    border-left: 2px solid var(--accent);
    border-radius: 0 var(--radius) var(--radius) 0;
    font-size: 12px;
    color: var(--ink-3);
    font-style: italic;
    line-height: 1.55;
  }
  /* <details> de fin de réponse (raisonnement collapsible) */
  .jdm-agent-bubble details {
    margin-top: 16px;
    border-top: 1px dashed var(--line);
    padding-top: 12px;
  }
  .jdm-agent-bubble details summary {
    cursor: pointer;
    list-style: none;
    font-size: 12px;
    color: var(--ink-3);
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 4px 0;
    user-select: none;
  }
  .jdm-agent-bubble details summary::-webkit-details-marker { display: none; }
  .jdm-agent-bubble details summary::before {
    content: '▸';
    display: inline-block;
    margin-right: 8px;
    transition: transform 0.18s;
  }
  .jdm-agent-bubble details[open] summary::before {
    transform: rotate(90deg);
  }
  .jdm-agent-bubble details summary:hover { color: var(--accent); }
  .jdm-agent-bubble details > *:not(summary) { margin-top: 10px; }

  /* Termes mis en valeur par le LLM (terme JDM, raffinement, etc.) */
  .jarvis-term, .jdm-term {
    background: var(--accent-soft);
    color: var(--accent);
    padding: 1px 6px;
    border-radius: 3px;
    font-family: var(--font-mono);
    font-size: 0.92em;
    font-weight: 500;
  }
  /* Relations JDM (r_isa, r_has_part…) */
  .jdm-rel {
    color: var(--accent);
    font-family: var(--font-mono);
    font-weight: 500;
  }

  /* ── Markdown prose (Projet / Aide) ── */
  .jdm-prose { max-width: 880px; line-height: 1.7; }
  .jdm-prose h1 {
    font-family: var(--font-display); font-weight: 600;
    font-size: 34px; letter-spacing: -0.02em;
    margin: 0 0 24px; color: var(--ink);
  }
  .jdm-prose h2 {
    font-family: var(--font-display); font-weight: 600;
    font-size: 24px; letter-spacing: -0.015em;
    margin: 36px 0 14px; color: var(--ink);
    padding-bottom: 6px; border-bottom: 1px solid var(--line-soft);
  }
  .jdm-prose h3 {
    font-family: var(--font-display); font-weight: 600;
    font-size: 18px; margin: 28px 0 10px; color: var(--ink);
  }
  .jdm-prose p { margin: 0 0 14px; color: var(--ink-2); }
  .jdm-prose strong { color: var(--ink); }
  .jdm-prose a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-soft); }
  .jdm-prose a:hover { border-bottom-color: var(--accent); }
  .jdm-prose ul, .jdm-prose ol { padding-left: 22px; margin: 0 0 14px; }
  .jdm-prose li { margin-bottom: 4px; color: var(--ink-2); }
  .jdm-prose li > strong { color: var(--ink); }
  .jdm-prose code {
    font-family: var(--font-mono); font-size: 0.88em;
    background: var(--bg-elev); padding: 2px 6px;
    border-radius: 3px; color: var(--ink);
  }
  .jdm-prose pre {
    background: var(--bg-elev); border: 1px solid var(--line-soft);
    border-radius: var(--radius); padding: 14px 16px;
    overflow-x: auto; margin: 0 0 18px;
  }
  .jdm-prose pre code {
    background: transparent; padding: 0; font-size: 12px;
    color: var(--ink); line-height: 1.55;
  }
  .jdm-prose table {
    border-collapse: collapse; width: 100%; margin: 14px 0 18px;
    font-size: 13px;
  }
  .jdm-prose th, .jdm-prose td {
    border: 1px solid var(--line); padding: 8px 12px; text-align: left;
    vertical-align: top;
  }
  .jdm-prose th {
    background: var(--bg-elev); font-weight: 600; color: var(--ink);
    font-family: var(--font-mono); font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .jdm-prose td { color: var(--ink-2); }
  .jdm-prose td > strong { color: var(--ink); }
  .jdm-prose blockquote {
    border-left: 3px solid var(--accent); padding: 6px 14px;
    background: var(--bg-elev); margin: 14px 0;
    color: var(--ink-2); font-style: italic;
  }
  .jdm-prose hr { border: none; border-top: 1px solid var(--line); margin: 28px 0; }
  .jdm-prose small { font-size: 11px; opacity: 0.85; }

  /* ── Carrousel horizontal (Projet : feature cards) ──
     Masque la scrollbar mais garde le scroll fonctionnel.
     scroll-padding pour que snap-align: start n'aligne pas sur le bord
     absolu (laisse 4px de marge pour les ombres). */
  .jdm-carousel {
    scrollbar-width: none;
    -ms-overflow-style: none;
    scroll-padding-left: 4px;
    scroll-behavior: smooth;
  }
  .jdm-carousel::-webkit-scrollbar { display: none; }
  .jdm-carousel > * { scroll-snap-stop: always; }

  /* ── Gate admin ── Tout élément .admin-only est masqué par défaut.
     Si l'URL contient ?admin=1, un script (plus bas) ajoute la classe
     .admin-revealed sur chaque .admin-only → affichage débloqué.
     On gate par classe sur l'élément lui-même (pas sur body) pour
     résister à un éventuel scoping CSS parent. */
  .admin-only { display: none !important; }
  .admin-only.admin-revealed { display: revert !important; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<body>

<div id="root"></div>

<!-- Gate admin : si ?admin=1 dans l'URL, on révèle les .admin-only.
     On observe le DOM pour aussi gater les éléments montés après le
     premier render (les vues React ajoutent .admin-only dynamiquement). -->
<script>
  (function() {
    var qs = new URLSearchParams(window.location.search);
    window.__JDM_ADMIN__ = (qs.get('admin') === '1');
    function reveal() {
      if (!window.__JDM_ADMIN__) return;
      document.querySelectorAll('.admin-only:not(.admin-revealed)')
        .forEach(function(el) { el.classList.add('admin-revealed'); });
    }
    reveal();
    var mo = new MutationObserver(reveal);
    document.addEventListener('DOMContentLoaded', function() {
      reveal();
      mo.observe(document.body, { childList: true, subtree: true });
    });
  })();
</script>

<script type="text/babel" src="webapp/tweaks-panel.jsx"></script>
