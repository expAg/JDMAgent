<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Sous-graphe JDM — plat asiatique (radial)</title>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
  html, body { margin:0; padding:0; height:100%; background:#fafafa; font-family: system-ui, sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid #eee; background:#fff; }
  h1 { margin:0; font-size:18px; }
  .sub { color:#666; font-size:13px; margin-top:2px; }
  #net { width:100%; height: calc(100vh - 110px); background:#fff; }
  #controls { position:absolute; top:70px; right:24px; z-index:10; display:flex; gap:6px; }
  #controls button { padding:6px 10px; border:1px solid #ccc; background:#fff; border-radius:6px; cursor:pointer; font-size:13px; }
  #controls button:hover { background:#f0f0f0; }
  .legend { padding:8px 20px; font-size:12px; color:#333; background:#fff; border-top:1px solid #eee; }
  .legend span { display:inline-block; padding:2px 8px; border-radius:4px; margin-right:8px; }
</style>
</head>
<body>
<header>
  <h1>« plat asiatique » — sous-graphe JDM (profondeur 2)</h1>
  <div class="sub">Nœud central fixé. Voisins niveau 1 en couleur (par type de relation), niveau 2 en gris clair. Molette = zoom, glisser = déplacer.</div>
</header>
<div id="controls">
  <button onclick="network.fit({animation:true})">Recentrer</button>
  <button onclick="zoomBy(1.3)">Zoom +</button>
  <button onclick="zoomBy(0.77)">Zoom −</button>
</div>
<div id="net"></div>
<div class="legend">
  <span style="background:#212121;color:#fff;">plat asiatique</span>
  <span style="background:#e3f2fd;">r_isa</span>
  <span style="background:#e8f5e9;">r_hypo</span>
  <span style="background:#f3e5f5;">r_carac</span>
  <span style="background:#fff3e0;">r_has_part</span>
  <span style="background:#e0f7fa;">r_lieu</span>
  <span style="background:#fce4ec;">r_patient-1</span>
  <span style="background:#f5f5f5;border:1px dashed #9e9e9e;">profondeur 2</span>
</div>

<script>
const C = {
  center: { background:'#212121', border:'#000', font:{ color:'#fff' } },
  isa:    { background:'#e3f2fd', border:'#1976d2' },
  hypo:   { background:'#e8f5e9', border:'#388e3c' },
  carac:  { background:'#f3e5f5', border:'#7b1fa2' },
  part:   { background:'#fff3e0', border:'#ef6c00' },
  lieu:   { background:'#e0f7fa', border:'#00838f' },
  verb:   { background:'#fce4ec', border:'#ad1457' },
  d2:     { background:'#fafafa', border:'#bdbdbd' }
};

const N = (id, label, kind, opts={}) => ({
  id, label,
  color: C[kind],
  shape: kind === 'center' ? 'ellipse' : 'box',
  font: { size: kind === 'center' ? 28 : (kind === 'd2' ? 18 : 22), color: kind === 'center' ? '#fff' : '#222', face:'system-ui' },
  margin: 12,
  widthConstraint: { maximum: 220 },
  ...opts
});

const nodes = new vis.DataSet([
  // CENTRE — fixé au milieu
  N('P', 'plat asiatique', 'center', { x:0, y:0, fixed:{x:true,y:true}, mass:5 }),

  // --- niveau 1 ---
  N('H1','spécialité culinaire','isa'),
  N('H2','plat','isa'),
  N('H3','préparation culinaire','isa'),

  N('Y1','curry','hypo'),
  N('Y2','sushi','hypo'),
  N('Y3','tempura','hypo'),
  N('Y4','canard laqué','hypo'),
  N('Y5','pho','hypo'),
  N('Y6','soupe miso','hypo'),

  N('C1','pimenté','carac'),
  N('C2','exotique','carac'),
  N('C3','sauté','carac'),
  N('C4','aigre-doux','carac'),

  N('I1','riz','part'),
  N('I2','légumes','part'),
  N('I3','gingembre','part'),
  N('I4','coriandre','part'),
  N('I5','citronnelle','part'),
  N('I6','soja','part'),
  N('I7','nuoc-mâm','part'),

  N('L1','Vietnam','lieu'),
  N('L2','Thaïlande','lieu'),
  N('L3','Asie','lieu'),
  N('L4','Corée','lieu'),

  N('V1','cuisiner','verb'),
  N('V2','préparer','verb'),
  N('V3','déguster','verb'),

  // --- niveau 2 ---
  N('Y1_a','Inde','d2'),
  N('Y1_b','moutarde','d2'),
  N('Y2_a','Tokyo','d2'),
  N('Y2_b','algues','d2'),
  N('Y2_c','saumon','d2'),
  N('Y4_a','canard','d2'),
  N('Y5_a','boeuf','d2'),
  N('Y5_b','badiane','d2'),
  N('Y5_c','bouillon','d2'),
  N('Y5_d','nouilles','d2'),
  N('I1_a','diététique','d2'),
  N('I1_b','cuire','d2'),
  N('I3_a','piquant','d2'),
  N('L1_a','vietnamien','d2'),
  N('H1_a','tarte','d2'),
  N('H1_b','gâteau','d2'),
  N('H1_c','kebab','d2')
]);

const E = (from, to, label, d2=false) => ({
  from, to, label, arrows:'to',
  font:{ size:14, color:'#555', background:'#ffffffcc', strokeWidth:0 },
  color:{ color: d2 ? '#cfcfcf' : '#9e9e9e' },
  dashes: d2,
  smooth:{ type:'dynamic' }
});

const edges = new vis.DataSet([
  // niveau 1
  E('P','H1','r_isa 121'), E('P','H2','r_isa 116'), E('P','H3','r_isa 30'),
  E('P','Y1','r_hypo 70'), E('P','Y2','r_hypo 69'), E('P','Y3','r_hypo 64'),
  E('P','Y4','r_hypo 64'), E('P','Y5','r_hypo 52'), E('P','Y6','r_hypo 35'),
  E('P','C1','r_carac 57'), E('P','C2','r_carac 57'), E('P','C3','r_carac 40'), E('P','C4','r_carac 40'),
  E('P','I1','r_has_part 59'), E('P','I2','r_has_part 47'), E('P','I3','r_has_part 45'),
  E('P','I4','r_has_part 45'), E('P','I5','r_has_part 45'), E('P','I6','r_has_part 41'), E('P','I7','r_has_part 41'),
  E('P','L1','r_lieu 67'), E('P','L2','r_lieu 67'), E('P','L3','r_lieu 67'), E('P','L4','r_lieu 50'),
  E('P','V1','r_patient-1 36'), E('P','V2','r_patient-1 30'), E('P','V3','r_patient-1 26'),

  // niveau 2
  E('Y1','Y1_a','r_lieu 83', true), E('Y1','I1','r_has_part 33', true), E('Y1','Y1_b','r_has_part 28', true),
  E('Y2','Y2_a','r_lieu 71', true), E('Y2','I1','r_has_part 135', true),
  E('Y2','Y2_b','r_has_part 30', true), E('Y2','Y2_c','r_has_part 27', true),
  E('Y4','Y4_a','r_has_part 40', true),
  E('Y5','Y5_a','r_has_part 68', true), E('Y5','Y5_b','r_has_part 58', true),
  E('Y5','Y5_c','r_has_part 50', true), E('Y5','Y5_d','r_has_part 35', true),
  E('I1','I1_a','r_carac 35', true), E('I1','I1_b','r_patient-1 174', true),
  E('I3','I3_a','r_carac 87', true),
  E('L1','L1_a','r_hypo 53', true),
  E('H1','H1_a','r_hypo 994', true), E('H1','H1_b','r_hypo 989', true), E('H1','H1_c','r_hypo 350', true)
]);

const container = document.getElementById('net');
const data = { nodes, edges };
const options = {
  layout: { improvedLayout: true },
  physics: {
    enabled: true,
    solver: 'forceAtlas2Based',
    forceAtlas2Based: {
      gravitationalConstant: -90,
      centralGravity: 0.05,
      springLength: 110,
      springConstant: 0.12,
      avoidOverlap: 1
    },
    stabilization: { iterations: 600 }
  },
  edges: { width: 1.4, selectionWidth: 3, hoverWidth: 2 },
  interaction: { hover:true, dragNodes:true, zoomView:true, zoomSpeed: 0.6, minZoom: 0.1, maxZoom: 4, hoverConnectedEdges:true, selectConnectedEdges:true },
  nodes: { borderWidth: 1.5, borderWidthSelected: 3 }
};
const network = new vis.Network(container, data, options);
network.once('stabilizationIterationsDone', () => {
  network.setOptions({ physics:{ enabled:false } });
  network.fit({ animation:{ duration:400 } });
});
function zoomBy(factor) {
  const s = network.getScale();
  network.moveTo({ scale: s * factor, animation:{ duration:200 } });
}

// Hover : met en évidence le nœud survolé et ses voisins, estompe le reste.
const allNodeIds = nodes.getIds();
const allEdgeIds = edges.getIds();
const baseNodeColors = {};
nodes.forEach(n => baseNodeColors[n.id] = n.color);

function highlight(focusId) {
  const connected = new Set(network.getConnectedNodes(focusId));
  connected.add(focusId);
  const connectedEdges = new Set(network.getConnectedEdges(focusId));
  nodes.update(allNodeIds.map(id => ({
    id,
    opacity: connected.has(id) ? 1 : 0.2,
    font: { color: connected.has(id) ? (id === 'P' ? '#fff' : '#222') : '#bbb' }
  })));
  edges.update(allEdgeIds.map(id => ({
    id,
    color: { color: connectedEdges.has(id) ? '#444' : '#eee' },
    font: { color: connectedEdges.has(id) ? '#222' : '#ddd', size:14, background:'#ffffffcc' }
  })));
}
function resetHighlight() {
  nodes.update(allNodeIds.map(id => ({ id, opacity:1, font:{ color: id === 'P' ? '#fff' : '#222' } })));
  edges.update(allEdgeIds.map(id => {
    const e = edges.get(id);
    return { id, color:{ color: e.dashes ? '#cfcfcf' : '#9e9e9e' }, font:{ color:'#555', size:14, background:'#ffffffcc' } };
  }));
}
network.on('hoverNode', p => highlight(p.node));
network.on('blurNode', resetHighlight);
</script>
</body>
</html>
